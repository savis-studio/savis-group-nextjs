name: build

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

# A new commit replaces the run of the same branch, except on main: a merged commit keeps its images.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check

  # The release path of deploy.sh on throwaway data: build both images, migrate an empty Postgres, start, crawl.
  audit:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run staging
      # The pages fall back to bundled content when the database fails, so the audit alone would not notice.
      - name: Database answers
        run: curl --fail-with-body --silent --show-error "http://localhost:3100/api/insights?limit=1"
      - run: npm run staging:check
      - name: App log
        if: failure()
        run: docker compose -f docker-compose.local.yml --env-file .env.staging.local logs --tail 200 app postgres

  # Pull requests are already built by the audit job.
  images:
    needs: [check, audit]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runner
            image: savis-app
          - target: tools
            image: savis-tools
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        run: |
          image="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          tags="${image}:${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then tags="${tags},${image}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
